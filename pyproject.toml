[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cad-dxf-agent"
version = "0.1.0"
description = "Local-first DXF layout editor with LLM-assisted prompt-to-edit planning, validation, preview, and safe save-as DXF workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "cad-dxf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "ezdxf>=1.3.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.scripts]
cad-dxf-agent = "cad_dxf_agent.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_dxf_agent"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ezdxf.*", "PySide6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "smoke: end-to-end smoke tests",
    "slow: tests that take significant time",
]

[tool.coverage.run]
source = ["cad_dxf_agent"]

[tool.coverage.report]
show_missing = true
fail_under = 50
