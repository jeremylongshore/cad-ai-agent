[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cad-dxf-agent"
dynamic = ["version"]
description = "Local-first DXF layout editor with LLM-assisted prompt-to-edit planning, validation, preview, and safe save-as DXF workflow."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "cad-dxf-agent contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    "ezdxf>=1.3.0",
    "pydantic>=2.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rtree>=1.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.6",
]
otel = [
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp>=1.21",
    "opentelemetry-semantic-conventions>=0.42b0",
]
gcp-trace = [
    "opentelemetry-exporter-gcp-trace>=1.6",
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
]
convert = [
    "pymupdf>=1.24",
    "Pillow>=10.0",
]
convert-fallback = [
    "pdfplumber>=0.10",
    "Pillow>=10.0",
]
draw = [
    "matplotlib>=3.8",
    "Pillow>=10.0",
]
gemini = [
    "google-cloud-aiplatform>=1.46",
    "Pillow>=10.0",
]
gemini-key = [
    "google-generativeai>=0.8",
]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=5.0",
    "syrupy>=4.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "pdfplumber>=0.10",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "fpdf2>=2.7",
    "pyinstaller>=6.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "firebase-admin>=6.6.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
cad-dxf-agent = "cad_dxf_agent.app:main"
cad-revision = "cad_dxf_agent.cli.main:main"

[tool.hatch.version]
path = "src/cad_dxf_agent/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_dxf_agent"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "SIM"]
ignore = ["S101"]  # Allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S108", "N806"]
"scripts/**/*.py" = ["S603", "S607", "E402"]  # subprocess + sys.path before imports
"src/**/alignment.py" = ["N803", "N806"]  # R, U, Vt, H are standard linear algebra names
"web/backend/**/*.py" = ["B008", "S108", "E402"]  # FastAPI Depends/File, /tmp sessions, sys.path

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ezdxf.*", "PySide6.*", "opentelemetry.*", "pdfplumber.*", "fitz.*", "matplotlib.*", "fpdf.*", "google.*", "vertexai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "smoke: end-to-end smoke tests",
    "slow: tests that take significant time",
    "integration: integration tests (full pipeline, multi-module)",
    "live_api: tests that call real Gemini API (require ADC via gcloud auth)",
    "gui: GUI tests (require PySide6 and QT_QPA_PLATFORM=offscreen)",
    "property: property/fuzz tests (randomized, bounded runtime)",
    "benchmark: performance micro-benchmarks (pytest-benchmark)",
    "web: web backend API tests (FastAPI TestClient)",
    "web_live: tests against deployed web backend (require CAD_WEB_URL)",
    "e2e: end-to-end tests using real DXF files (run scripts/download_e2e_fixtures.sh first)",
]

[tool.coverage.run]
source = ["cad_dxf_agent"]
omit = [
    "src/cad_dxf_agent/ui/*",
    "src/cad_dxf_agent/app.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 65
