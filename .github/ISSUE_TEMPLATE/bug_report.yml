name: Bug Report
description: Report a bug in cad-dxf-agent
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug. Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.12.0"
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "Windows 11"
  - type: textarea
    id: dxf-info
    attributes:
      label: DXF File Details
      description: If relevant, describe the DXF file (size, entity count, software that created it).
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      render: shell
