name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"(.+?)\"', open('src/cad_dxf_agent/__init__.py').read()).group(1))")
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          pip install -e ".[gui,build]"

      - name: Run unit tests
        run: |
          pip install -e ".[dev]"
          pytest tests/unit/ -q

      - name: Build with PyInstaller
        run: |
          python scripts/build.py --clean --skip-test

      - name: Verify build output
        run: |
          dir dist\cad-dxf-agent\
          $size = (Get-ChildItem -Recurse dist\cad-dxf-agent | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Output "Bundle size: $([math]::Round($size, 1)) MB"
          if ($size -lt 10) { throw "Bundle too small — likely missing dependencies" }

      - name: Smoke test (headless)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:CAD_LLM_PROVIDER = "mock"
          $proc = Start-Process -FilePath "dist\cad-dxf-agent\cad-dxf-agent.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 10
          if (-not $proc.HasExited) {
            Stop-Process $proc
            Write-Output "PASS: bundle started successfully"
          } else {
            Write-Output "App exited with code: $($proc.ExitCode)"
          }

      - name: Build Inno Setup installer
        if: hashFiles('installer/setup.iss') != ''
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.8
        with:
          path: installer/setup.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad-dxf-agent-windows
          path: dist/cad-dxf-agent/

      - name: Upload installer artifact
        if: hashFiles('dist/cad-dxf-agent-setup-*.exe') != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/cad-dxf-agent-setup-*.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cad-dxf-agent-setup-*.exe
          draft: true
