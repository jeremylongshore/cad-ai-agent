name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: cad-dxf-agent
  REGION: us-central1
  SERVICE_NAME: cad-dxf-web

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          source: .
          region: ${{ env.REGION }}
          env_vars: |
            CAD_LLM_PROVIDER=gemini
            CAD_GCP_PROJECT=${{ env.GCP_PROJECT }}
            CAD_WEB_CORS_ORIGIN=https://cad-dxf-agent.web.app
          flags: |
            --allow-unauthenticated
            --memory=1Gi
            --cpu=1
            --timeout=300

      - name: Show backend URL
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyD2ocFCZ9h9xZqU0GYojASqpsA1IwIIpGI
          VITE_FIREBASE_AUTH_DOMAIN: cad-dxf-agent.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: cad-dxf-agent
          VITE_FIREBASE_STORAGE_BUCKET: cad-dxf-agent.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "688314245119"
          VITE_FIREBASE_APP_ID: "1:688314245119:web:f243af75ca63893e8151ca"
          VITE_API_URL: ${{ needs.deploy-backend.outputs.url }}

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: npx firebase-tools deploy --only hosting --project ${{ env.GCP_PROJECT }} --non-interactive
