name: Production Canary Monitoring

on:
  # Manual-only. The hosted demo instance this canary tested was retired, so the
  # daily run only produced guaranteed failures. Re-add the schedule below if a
  # public instance is ever restood:
  #   schedule:
  #     - cron: '0 8 * * *'   # daily at 8am UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run canary tests against production
        working-directory: web/frontend
        env:
          TARGET: production
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test -c playwright.config.js --grep "canary" --reporter=list
        continue-on-error: true

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-results-${{ github.run_id }}
          path: |
            web/frontend/test-results/canary-results/
            web/frontend/test-results/screenshots/canary-*
          retention-days: 30

      - name: Check for failures
        working-directory: web/frontend
        run: |
          RESULTS=$(find test-results/canary-results -name '*.json' 2>/dev/null | wc -l)
          if [ "$RESULTS" -eq "0" ]; then
            echo "::error::No canary result files found — tests may not have run"
            exit 1
          fi
          FAILED=$(find test-results/canary-results -name '*.json' -exec grep -lE '"outcome"\s*:\s*"(error|timeout)"' {} \; | wc -l)
          if [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED canary test(s) failed"
            exit 1
          fi
          echo "All canary tests passed ($RESULTS result files checked)"
