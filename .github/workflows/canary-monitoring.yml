name: Production Canary Monitoring

on:
  schedule:
    # Daily at 8am UTC
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium

      - name: Run canary tests against production
        working-directory: web/frontend
        env:
          TARGET: production
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test -c playwright.config.js --grep "canary" --reporter=list
        continue-on-error: true

      - name: Upload canary results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: canary-results-${{ github.run_id }}
          path: |
            web/frontend/test-results/canary-results/
            web/frontend/test-results/screenshots/canary-*
          retention-days: 30

      - name: Check for failures
        working-directory: web/frontend
        run: |
          FAILED=$(find test-results/canary-results -name '*.json' -exec grep -l '"outcome":"error"\|"outcome":"timeout"' {} \; | wc -l)
          if [ "$FAILED" -gt "0" ]; then
            echo "::error::$FAILED canary test(s) failed"
            exit 1
          fi
          echo "All canary tests passed"
