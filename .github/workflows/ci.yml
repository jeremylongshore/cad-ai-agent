name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # enables manual runs (e.g. the live-test job)

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Architectural drift detection
        run: bash scripts/ci/check_nodrift.sh

  lint:
    runs-on: ubuntu-latest
    needs: [drift-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    needs: [drift-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/

  audit-harness:
    runs-on: ubuntu-latest
    needs: [drift-check]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify harness hash-pin (tamper check)
        # Blocking: exit 2 = HARNESS_TAMPERED (a pinned harness script changed
        # without a fresh `audit-harness init`). Keeps the quality gates honest.
        run: bash scripts/audit-harness verify
      - name: Escape-scan the PR diff for test-weakening
        # Blocking on PRs: REFUSE (exit 2) = coverage floor lowered / tests
        # deleted / pinned artifact touched; CHALLENGE (exit 1) = skip marker /
        # mutation bypass / trivially-true assertion added. Floor read from
        # tests/TESTING.md (coverage.line: 65).
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/scan.diff
          bash scripts/audit-harness escape-scan /tmp/scan.diff
      - name: Test-bias scan (advisory)
        run: bash scripts/audit-harness bias || true
      - name: Architecture rules (advisory — no rule config yet)
        run: bash scripts/audit-harness arch || true

  test:
    runs-on: ${{ matrix.os }}
    needs: [drift-check]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=cad_dxf_agent --cov-report=term-missing -v --ignore=tests/benchmark
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage

  benchmark:
    runs-on: ubuntu-latest
    needs: [drift-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run benchmarks
        run: pytest tests/benchmark/ -v --benchmark-json=benchmark.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json
