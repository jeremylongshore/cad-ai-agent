name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Architectural drift detection
        run: bash scripts/ci/check_nodrift.sh

  lint:
    runs-on: ubuntu-latest
    needs: [drift-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    needs: [drift-check]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy src/

  test:
    runs-on: ${{ matrix.os }}
    needs: [drift-check]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov=cad_dxf_agent --cov-report=term-missing -v --ignore=tests/benchmark
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage

  benchmark:
    runs-on: ubuntu-latest
    needs: [drift-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run benchmarks
        run: pytest tests/benchmark/ -v --benchmark-json=benchmark.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.json

  live-test:
    runs-on: ubuntu-latest
    needs: [drift-check, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Install dependencies
        run: pip install -e ".[dev,gemini]"
      - name: Run live API tests
        run: |
          mkdir -p tests/live/reports
          pytest tests/live/ -v -m live_api -s --log-cli-level=INFO 2>&1 | tee tests/live/reports/live-test-run.log
        env:
          CAD_GCP_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          CAD_GCP_LOCATION: us-central1
      - name: Upload live test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-test-logs
          path: tests/live/reports/live-test-run.log
