name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scan
        run: bandit -r src/ -c pyproject.toml || bandit -r src/ -ll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pip-audit
        run: pip-audit --local --ignore-vuln CVE-2026-4539  # pygments 2.19.2, no fix released yet

  trivy-dockerfile:
    runs-on: ubuntu-latest
    # Only run when Dockerfile or its build context changes
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem + Dockerfile scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: web/backend/Dockerfile
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy image-build vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: '.'
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: '.venv,node_modules,web/frontend/node_modules,.audit-harness,dist,mutants,proxy'

  # dependency-review requires GitHub Advanced Security (paid for private repos).
  # Re-enable if repo goes public or plan is upgraded.
