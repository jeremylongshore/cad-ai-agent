name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # schedule disabled — burns Actions minutes
  # schedule:
  #   - cron: '0 6 * * 1'  # Weekly Monday 6 AM UTC

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scan
        run: bandit -r src/ -c pyproject.toml || bandit -r src/ -ll

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pip-audit
        run: pip-audit

  # dependency-review requires GitHub Advanced Security (paid for private repos).
  # Re-enable if repo goes public or plan is upgraded.
